<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#120f0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>PAY</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">PAY</div>
      <div class="top-meta">
        <span id="net">ONLINE</span>
        <span id="clock">--:--</span>
      </div>
    </header>
    <div class="workspace">
      <nav class="nav" id="nav" aria-label="PAY">
        <button type="button" data-nav="home">Sale</button>
        <button type="button" data-nav="services">Services</button>
        <button type="button" data-nav="history">History</button>
        <button type="button" data-nav="settings">Settings</button>
      </nav>
      <main class="stage">
        <p class="toast" id="toast" role="status"></p>
        <div id="screen"></div>
        <p class="foot">
          <span id="terminal-id">RF-TERM-000001</span>
          <span id="software-version">v1.0.4</span>
        </p>
      </main>
    </div>
  </div>
  <script type="module" src="/assets/terminal.js"></script>
</body>
</html>
